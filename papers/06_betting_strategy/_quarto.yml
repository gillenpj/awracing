project:
  type: default
  output-dir: _output
  render:
    - index.qmd

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    fig-width: 8
    fig-height: 5
    embed-resources: true
    theme: cosmo
    code-fold: true

bibliography: references.bib

execute:
  echo: false
  warning: false
  message: false
